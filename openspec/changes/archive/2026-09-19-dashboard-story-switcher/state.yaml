context: >
  Follow-up to a direct (non-SDD) change already shipped this session: TicketPanel
  in aicli/tui/widgets.py was restructured from a flat ticket list to board-prefix
  grouping with a 4-min auto-refresh (see Engram decision "TicketPanel: agrupación
  por tablero + refresh automático cada 4 min"). User then asked for something
  bigger: board-switching UX + story/sibling-subtask hierarchy, validated through
  two rounds of interactive HTML mockups (published as a Claude Artifact) before
  committing to "Option B": a full-width single-board view with story cards
  (each story = one card, its sibling sub-tasks shown as inline status chips),
  reopened tickets pinned in a strip above the cards, and a command-palette-style
  board switcher (press "b", fuzzy-filter, Enter to jump) instead of a persistent
  board rail. User explicitly approved this direction and asked to implement it
  "lo mejor posible, sacándole y aprovechando todas las herramientas que tenemos
  a la mano" (make the most of it, using every tool available) and authorized
  SDD if the change turns out large enough — which it is.

pre_validated_ux: >
  The interaction model was already validated with the user via two interactive
  mockup rounds (not just described — actually clicked/keyboard-navigated by the
  user in a published HTML artifact) before this SDD change started:
  - Up/Down arrow moves focus among: reopened-ticket rows, story cards, loose
    (no-parent) ticket rows.
  - Left/Right arrow moves a sub-focus across a focused story card's sibling
    chips (done/current/todo/blocked visual states).
  - Enter opens whichever is focused (a reopened row, a loose ticket, or the
    currently sub-focused chip inside a story card).
  - "b" opens a board-switcher overlay; typing filters a fuzzy list of boards
    with ticket + reopened counts; Up/Down moves selection, Enter confirms and
    switches the active board, Esc cancels.
  - Reopened tickets are always pinned in their own labeled section above the
    story cards, never mixed into the story/loose list.
  Treat this as validated product requirements, not something to re-litigate in
  explore/propose — the job is to figure out how to build it against the real
  Textual/jira.py code, not whether this is the right UX.

known_groundwork_from_this_session: >
  - aicli/services/jira.py already has fetch_issue() (returns fields.parent as
    {key, summary} when the issue is a sub-task) and fetch_subtasks(parent_key)
    (hits /rest/api/3/issue/{parent_key}?fields=subtasks, returns sibling cards
    with id/summary/status/tipo — status per sibling is free, assignee per
    sibling is NOT included in this lightweight response).
  - fetch_my_issues() (used by TicketPanel today) requests only
    fields: ["summary","status","priority"] — does NOT request "parent", so the
    dashboard cannot see hierarchy without adding that field to the request.
  - This hierarchy fetch is already wired into ctx resume/ctx task as a
    one-shot questionary/request_select prompt ("¿seguís con este ticket o
    saltás a un hermano?") in aicli/tui/screens.py's _resume_jira_context
    (~line 243) — it has never been a persistent, browsable view. This change
    surfaces existing capability, it is not new Jira API surface.
  - aicli/tui/widgets.py's TicketPanel (just modified this session) has the
    board-prefix-grouping logic (_group_by_board) and the 4-min
    set_interval-based auto-refresh already in place — this change likely
    REPLACES _group_by_board's tree-like rendering with the new card+chip
    layout, but should keep the same fetch/refresh/selection-preservation
    scaffolding where it still applies.
  - aicli/tui/modals.py already has native modal patterns (ConfirmModal,
    InputModal per DEC-051, and reportedly a SelectModal) — the board-switcher
    overlay should reuse whichever of these fits (likely closest to a
    fuzzy-filterable SelectModal) rather than building a new modal paradigm
    from scratch. Verify exact modal APIs available in modals.py.


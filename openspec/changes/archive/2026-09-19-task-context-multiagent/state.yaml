pre_decided_architecture: >
  User explicitly wants to get maximum real value out of LangGraph/LangChain for
  this piece specifically ("uno de los que mas quiero que mejor se haga para
  sacarle el maximo jugo") — this is NOT a minimal-footprint change, unlike most
  of this project's other decisions. Confirmed via live doc verification this
  session (docs.langchain.com), not assumed:

  - Outer orchestration: a `StateGraph` (plain `langgraph` package — confirmed
    standalone-installable, does NOT require the full `langchain` package) with
    3 parallel specialist nodes feeding one synthesis node:
    1. "El Detective de Módulos" — replaces/extends today's single-shot
       `_detect_relevant_modules` (already migrated through changes 1-3: cached
       system-prefix, forced tool_choice, semantic top-N prefilter). This node
       gets a REAL iterative tool-calling loop.
    2. "El Historiador de Jira" — searches tickets.json history for similar past
       cases/precedent on this type of task (has this broken before? what fixed
       it?). Likely single-shot, no iteration — confirm/decide in propose.
    3. "El Vigía de Tests" — checks which existing tests cover the
       candidate-affected modules, flags coverage gaps. Likely single-shot, no
       iteration — confirm/decide in propose.
    4. "El Sintetizador" — reconciles the three parallel outputs into ONE
       enriched task brief, replacing/extending today's `_generate_task_brief`.

  - The Detective de Módulos node specifically uses LangChain's `create_agent`
    (confirmed via live doc fetch this session: builds a full ReAct loop — model
    calls tools in a loop until done — from `model` + `tools` + `prompt`, returns
    a compiled LangGraph runnable). This is the ONE node in this whole change
    that genuinely benefits from create_agent's automatic loop, because it's the
    only one where real multi-turn iteration (read a module doc, decide if
    another lookup is needed, repeat) adds real value over a single-shot call.
    Confirmed: create_agent requires the fuller `langchain` package (its `model`
    param takes a provider-prefixed string like "anthropic:claude-sonnet-5" —
    this reintroduces the multi-provider abstraction layer DEC-080 previously
    rejected for MAGNA, but ONLY for this one node, as a deliberate, informed
    tradeoff the user accepted, not an oversight).
  - Do NOT use create_agent for the other 2 specialist nodes unless propose/design
    finds a real concrete reason they need iteration too — default assumption is
    they're single-shot tool calls, plain Anthropic SDK calls (like changes 1-3),
    no LangChain needed for those two.
  - This means the final dependency footprint is: `langgraph` (lean) for the
    graph structure + `langchain`/`langchain-anthropic` (heavier, provider
    abstraction) ONLY pulled in for the Detective node's create_agent usage.
    State this tradeoff plainly in the proposal so it's an informed decision,
    not a silent scope creep.

reasoning: >
  This mirrors the same "use real production AI tooling as a deliberate
  learning/practice choice, not just the minimal-footprint option" reasoning
  already established for change 3's Chroma decision (see Engram decision id
  262) — the user has been consistent about this preference across both changes.


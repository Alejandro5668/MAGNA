pre_decided:
  embedding_source: "Chroma embedded (PersistentClient, no server) using Chroma's own DefaultEmbeddingFunction (all-MiniLM-L6-v2 via onnxruntime) — free, local, zero marginal dependency since the full chromadb package already requires onnxruntime for this. Rejected: Voyage/OpenAI (user does not want to pay per API call), sentence-transformers+torch (redundant heavy dependency duplicating what onnxruntime already does for the same job). See Engram decision id 262."
  reasoning: "User explicitly wants to use real production-grade AI tooling as a learning/practice vehicle for this project, not just the minimal-footprint option — this justifies Chroma over a hand-rolled SQLite-BLOB+numpy approach even though the latter would be simpler at MAGNA's actual data scale."

